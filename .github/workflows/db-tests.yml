name: DB tests (ADR 0013 RLS/migration suite)

# Boots a real local Supabase (Postgres + RLS) stack via Docker on the runner and
# runs the migration-backed integration tests that need one. These are the same
# tests that skip locally when run without a live Supabase instance
# (`*_INTEGRATION_TEST_ENABLED` gates) — this workflow is what turns them from
# "authored" into "passing in CI". No app code is deployed; this never touches
# the linked remote Supabase project.

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'supabase/**'
      - 'lib/db/**'
      - 'lib/members/**'
      - 'lib/config.ts'
      - '.github/workflows/db-tests.yml'

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the local dev toolchain (Node 24 / npm 11) that this repo's
      # committed package-lock.json actually resolves cleanly against — Node 20
      # / npm 10 in CI failed `npm ci` with a lock-file-out-of-sync error
      # (missing @swc/helpers@0.5.23), and undici@8.2.0 itself requires
      # Node >=22.19.0.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install -g npm@11
          npm ci

      # Pinned to an exact tag: no floating major tag (v1/v2) is published for
      # this action, so `@v3`/`@v2` are not resolvable refs. Auto-detection via
      # an omitted `version` input still applies — this only pins the action's
      # own release, not the supabase CLI version it installs (that comes from
      # package-lock.json's pinned supabase@^2.97.0).
      - uses: supabase/setup-cli@v2.1.1

      # "FATAL: the database system is in recovery mode" (PGRST000) started
      # appearing once the earlier connection-pressure fixes (--no-file-
      # parallelism, --retry) let the suite run further into its auth-heavy
      # tests — that message means Postgres itself crashed and is replaying
      # WAL, not just refusing a new connection. Most likely cause on a
      # 2-core/~7GB GH Actions runner: the full stack (db, auth, rest, kong,
      # realtime, storage, imgproxy, studio, meta, analytics/vector,
      # edge-runtime) all run in one docker compose group, and the analytics
      # pipeline (Logflare+Vector) in particular is a known heavy consumer.
      # None of the excluded services here are used by this workflow: no
      # supabase.storage / storage.* calls, no realtime.* usage, no edge
      # functions, no Studio, and admin.createUser({ email_confirm: true })
      # never sends mail (no inbucket/mailpit needed). Trimming the stack to
      # db+auth+rest+kong reduces memory pressure so Postgres doesn't get
      # OOM-killed under load.
      - name: Start local Supabase stack (applies supabase/migrations M1-M9)
        run: supabase start -x analytics,vector,edge-runtime,functions,imgproxy,inbucket,storage,studio,meta,realtime

      - name: Reset DB (deterministic re-apply of all migrations)
        run: supabase db reset

      - name: Export Supabase connection env vars
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase-status.env
          echo "--- raw supabase status -o env output (for debugging) ---"
          sed -E 's/(ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET)="?.{6}/\1="[redacted]/' /tmp/supabase-status.env
          # shellcheck disable=SC1091
          source /tmp/supabase-status.env

          for name in API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::supabase status -o env did not produce $name — check the raw output above and update this step's mapping"
              exit 1
            fi
          done

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      # `supabase db reset` returns as soon as migrations are applied, but PostgREST
      # can take a moment to notice the schema and reload its cache. That shows up
      # as a 404/connection-refused window, so poll a real table read with the
      # service-role key and retry those. A 401/403, however, is Postgres itself
      # refusing the role a table-level GRANT (42501) — that is never transient,
      # so fail immediately instead of burning the retry budget and misreporting
      # a real permissions bug as "PostgREST not ready" (see 20260707190000
      # migration for the actual fix — explicit service_role GRANTs).
      - name: Wait for PostgREST schema cache to warm up
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status=$(curl -s -o /tmp/pgrst-probe.json -w '%{http_code}' \
              "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/businesses?select=id&limit=1" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}") || status="000"
            if [ "$status" = "200" ] || [ "$status" = "206" ]; then
              echo "PostgREST ready after $i attempt(s) (HTTP $status)"
              exit 0
            fi
            if [ "$status" = "401" ] || [ "$status" = "403" ]; then
              echo "::error::PostgREST rejected the service-role key with HTTP $status — this is a real grants/auth problem, not a startup race. Response:"
              cat /tmp/pgrst-probe.json 2>/dev/null || true
              exit 1
            fi
            echo "Attempt $i: PostgREST not ready yet (HTTP $status) — retrying in 1s"
            cat /tmp/pgrst-probe.json 2>/dev/null || true
            sleep 1
          done
          echo "::error::PostgREST did not become ready after 30 attempts"
          exit 1

      - name: Run ADR 0013 DB-backed integration test suite
        env:
          NODE_ENV: test
          # Test-only dummies — never used for real network calls (EMAIL_PROVIDER
          # defaults to 'mock' under NODE_ENV=test, so RESEND_* stay unset).
          ANTHROPIC_API_KEY: 'sk-ant-test-dummy-key-not-real'
          STRIPE_SECRET_KEY: 'sk_test_dummy0000000000000000'
          STRIPE_WEBHOOK_SECRET: 'whsec_dummy0000000000000000'
          STRIPE_PRICE_ID_PLUS: 'price_dummy_plus'
          STRIPE_PRICE_ID_PRO: 'price_dummy_pro'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_dummy0000000000000000'
          OAUTH_STATE_SECRET: 'ci-dummy-oauth-state-secret-32chars-min'
          INVITE_TOKEN_SECRET: 'ci-dummy-invite-token-secret-32chars-min'
          # Directory-scoped selector: every file in supabase/__tests__/ gates on
          # its own *_INTEGRATION_TEST_ENABLED flag; setting all of them is how
          # this job opts the whole directory in (ADR 0013 §10 named constraints).
          ACCEPT_INVITE_INTEGRATION_TEST_ENABLED: 'true'
          BACKFILL_PURGE_INTEGRATION_TEST_ENABLED: 'true'
          MEMBERS_INTEGRATION_TEST_ENABLED: 'true'
          CAMPAIGNS_SOCIAL_ROLE_INTEGRATION_TEST_ENABLED: 'true'
          RLS_MATRIX_INTEGRATION_TEST_ENABLED: 'true'
          POSTS_APPROVAL_INTEGRATION_TEST_ENABLED: 'true'
          SEAT_CAP_INTEGRATION_TEST_ENABLED: 'true'
          USER_CAN_INTEGRATION_TEST_ENABLED: 'true'
          DELETION_INTEGRATION_TEST_ENABLED: 'true'
          ENSURE_OWNER_MEMBERSHIP_INTEGRATION_TEST_ENABLED: 'true'
        # --no-file-parallelism: these tests all share one local Postgres/GoTrue
        # instance (single ephemeral CI container), so running test files
        # concurrently buys no isolation — only connection pressure. Vitest's
        # default file-level parallelism was fine while most files failed early
        # on the 42501 grants bug (low cumulative connection count); once fixed,
        # files ran to completion in parallel and exhausted local Postgres/GoTrue
        # connections, surfacing as PGRST001 "no connection to the server" and
        # GoTrue's "Database error creating new user" — not a permissions issue.
        # --retry=2: even fully sequential (see --no-file-parallelism above),
        # the local Postgres/GoTrue/PostgREST stack on a 2-core CI runner
        # occasionally can't keep up with auth-heavy setup (admin.createUser,
        # bcrypt hashing) and momentarily refuses connections or can't reload
        # its schema cache — PGRST001 "no connection to the server" and
        # GoTrue's "Database error creating new user" are the services' own
        # internal retry messages surfacing to the client as a failure. These
        # are self-describing transient errors, not deterministic bugs (the
        # exact test that trips varies run to run) — unlike the earlier 42501
        # grants bug, retrying here is the correct fix, not a band-aid.
        run: npx vitest run supabase/__tests__ --no-file-parallelism --retry=2

      - name: Dump Supabase status + container logs on failure
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true
          for c in $(docker ps -a --filter "name=supabase" --format '{{.Names}}'); do
            echo "--- logs: $c ---"
            docker logs "$c" --tail 200 || true
          done

      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup
