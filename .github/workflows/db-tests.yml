name: DB tests (ADR 0013 RLS/migration suite)

# Boots a real local Supabase (Postgres + RLS) stack via Docker on the runner and
# runs the migration-backed integration tests that need one. ADR 0015 §4
# (CI-NO-SUITE-FLAGS): these suites run unconditionally now — no per-suite
# *_INTEGRATION_TEST_ENABLED flag gates them anymore, so running them locally
# without a live Supabase instance fails/errors rather than silently skipping.
# This workflow is what turns them from "authored" into "passing in CI". No app
# code is deployed; this never touches the linked remote Supabase project.

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'supabase/**'
      - 'lib/db/**'
      - 'lib/members/**'
      - 'lib/config.ts'
      - '.github/workflows/db-tests.yml'

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the local dev toolchain (Node 24 / npm 11) that this repo's
      # committed package-lock.json actually resolves cleanly against — Node 20
      # / npm 10 in CI failed `npm ci` with a lock-file-out-of-sync error
      # (missing @swc/helpers@0.5.23), and undici@8.2.0 itself requires
      # Node >=22.19.0.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install -g npm@11
          npm ci

      # Pinned to an exact tag: no floating major tag (v1/v2) is published for
      # this action, so `@v3`/`@v2` are not resolvable refs.
      #
      # `version:` here OVERRIDES this action's normal lockfile auto-detection
      # (which would otherwise install the CLI pinned in package-lock.json,
      # supabase@2.109.1 — bundling Postgres image 17.6.1.111). That image
      # range (17.6.1.099-17.6.1.112) ships a broken supautils (3.2.0/3.2.1):
      # any EXECUTE-permission-denied call to a SECURITY DEFINER function
      # SIGSEGVs the backend and takes the whole cluster into recovery —
      # confirmed upstream at supabase/postgres#2367, #2112, #2377, fixed in
      # supautils 3.2.2 (image 17.6.1.113+). This is what
      # supabase/__tests__/vault-update-secret.test.ts's anon/authenticated
      # denial assertions were tripping (Session 30.5-D, misdiagnosed at the
      # time as OOM/memory pressure — it is not).
      #
      # Pinned to a concrete version, not the bare word "beta": the action
      # release we're on (v2.1.1) predates that dist-tag alias and passes
      # `version` straight to a semver comparison, so the literal string
      # "beta" fails with "Invalid SemVer: beta". 2.117.0-beta.21 is the npm
      # `beta` dist-tag's current resolution (2026-09-05) and tracks
      # supabase/cli's current default-versions manifest, already well past
      # the fix. Once a stable CLI release ships an image >=17.6.1.113, drop
      # this override and let lockfile auto-detection resume.
      - uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.117.0-beta.21

      # A `supabase start -x analytics,vector,...` CLI-flag attempt to trim
      # the stack (bug-111) did NOT actually stop those containers -- real
      # container logs (bug-112) showed Logflare (analytics) still fully
      # running, its Cainophile logical-replication client and Oban polling
      # loop active against Postgres right up to the crash. The confirmed
      # fix lives in supabase/config.toml ([analytics] enabled = false),
      # which is the layer that actually takes effect -- see that file for
      # the full root-cause writeup. Left as plain `supabase start` here.
      - name: Start local Supabase stack (applies supabase/migrations M1-M9)
        run: supabase start

      - name: Export Supabase connection env vars
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase-status.env
          echo "--- raw supabase status -o env output (for debugging) ---"
          sed -E 's/(ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET)="?.{6}/\1="[redacted]/' /tmp/supabase-status.env
          # shellcheck disable=SC1091
          source /tmp/supabase-status.env

          for name in API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::supabase status -o env did not produce $name — check the raw output above and update this step's mapping"
              exit 1
            fi
          done

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      # ADR 0015 §3.2b, CORRECTED (session-22 B2 live-CI finding): the original ALTER-SYSTEM +
      # container-restart plan failed in real CI with "permission denied to set parameter" — the
      # `postgres` role in Supabase's local dev stack is not a superuser and cannot run ALTER
      # SYSTEM (mirrors hosted Supabase's permission model). The knobs now live in
      # supabase/config.toml's `[db.settings]` (the CLI-native, documented mechanism), baked into
      # postgresql.conf before the container starts — so on this fresh runner (no pre-existing
      # container) they take effect on the `supabase start` above with no restart needed. This
      # step only VERIFIES they took effect; the job FAILS and the Builder STOPS if they didn't —
      # an unverified remedy reports green while doing nothing (F3, CI-KNOBS-VERIFIED). No
      # `|| true`, no continue-on-error here.
      - name: Verify Postgres knobs took effect
        run: |
          set -euo pipefail
          vals=$(psql "$DATABASE_URL" -tA -c "SHOW shared_buffers; SHOW max_connections; SHOW work_mem;")
          echo "knobs: $vals"
          echo "$vals" | grep -qx '128MB' || { echo "::error::shared_buffers did not stick (expected 128MB) — check supabase/config.toml [db.settings]"; exit 1; }
          echo "$vals" | grep -qx '50'    || { echo "::error::max_connections did not stick (expected 50) — check supabase/config.toml [db.settings]"; exit 1; }
          echo "$vals" | grep -qx '8MB'   || { echo "::error::work_mem did not stick (expected 8MB) — check supabase/config.toml [db.settings]"; exit 1; }

      # Session 30.5-D, D8 (BLOCKER-2): three consecutive reds showed a 503-to-
      # every-role mid-suite crash (57P03 recovery mode) with OOMKilled:false on
      # the Postgres container — database-reviewer's diagnosis is that a cgroup
      # kill of a CHILD backend (not the tracked PID 1) never sets that flag, so
      # the only after-the-fact `if: failure()` diagnostics couldn't have caught
      # it. This backgrounds a live sample of container stats + cgroup memory
      # counters DURING the run and uploads it UNCONDITIONALLY — a process that
      # gets killed mid-run may never trigger the failure trap at all.
      - name: Start live memory-pressure watch (backgrounded)
        run: |
          (
            while true; do
              date -u +%FT%TZ
              docker stats --no-stream || true
              for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events; do
                [ -r "$f" ] && { echo "-- $f --"; cat "$f"; }
              done
              sleep 2
            done
          ) >> /tmp/mem-watch.log 2>&1 &
          echo "MEM_WATCH_PID=$!" >> "$GITHUB_ENV"

      - name: Reset DB (deterministic re-apply of all migrations)
        run: supabase db reset

      # `supabase db reset` returns as soon as migrations are applied, but PostgREST
      # can take a moment to notice the schema and reload its cache. That shows up
      # as a 404/connection-refused window, so poll a real table read with the
      # service-role key and retry those. A 401/403, however, is Postgres itself
      # refusing the role a table-level GRANT (42501) — that is never transient,
      # so fail immediately instead of burning the retry budget and misreporting
      # a real permissions bug as "PostgREST not ready" (see 20260707190000
      # migration for the actual fix — explicit service_role GRANTs).
      - name: Wait for PostgREST schema cache to warm up
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status=$(curl -s -o /tmp/pgrst-probe.json -w '%{http_code}' \
              "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/businesses?select=id&limit=1" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}") || status="000"
            if [ "$status" = "200" ] || [ "$status" = "206" ]; then
              echo "PostgREST ready after $i attempt(s) (HTTP $status)"
              exit 0
            fi
            if [ "$status" = "401" ] || [ "$status" = "403" ]; then
              echo "::error::PostgREST rejected the service-role key with HTTP $status — this is a real grants/auth problem, not a startup race. Response:"
              cat /tmp/pgrst-probe.json 2>/dev/null || true
              exit 1
            fi
            echo "Attempt $i: PostgREST not ready yet (HTTP $status) — retrying in 1s"
            cat /tmp/pgrst-probe.json 2>/dev/null || true
            sleep 1
          done
          echo "::error::PostgREST did not become ready after 30 attempts"
          exit 1

      # ADR 0015 §4 (CI-NO-SUITE-FLAGS): the eleven per-suite *_INTEGRATION_TEST_ENABLED flags
      # are deleted. A DB suite now runs unconditionally whenever the DB env is present — which
      # it always is here (env vars exported above) — never conditional on a flag someone
      # remembered to set (the INV-REISSUE-SAME-ROW false-green in 21B was exactly this: a flag
      # left off).
      - name: Run ADR 0013 DB-backed integration test suite (JSON-reportered)
        env:
          NODE_ENV: test
          # Test-only dummies — never used for real network calls (EMAIL_PROVIDER
          # defaults to 'mock' under NODE_ENV=test, so RESEND_* stay unset).
          ANTHROPIC_API_KEY: 'sk-ant-test-dummy-key-not-real'
          STRIPE_SECRET_KEY: 'sk_test_dummy0000000000000000'
          STRIPE_WEBHOOK_SECRET: 'whsec_dummy0000000000000000'
          STRIPE_PRICE_ID_PLUS: 'price_dummy_plus'
          STRIPE_PRICE_ID_PRO: 'price_dummy_pro'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_dummy0000000000000000'
          OAUTH_STATE_SECRET: 'ci-dummy-oauth-state-secret-32chars-min'
          INVITE_TOKEN_SECRET: 'ci-dummy-invite-token-secret-32chars-min'
          # [Session 27-D / A-4] GITHUB_APP_* deliberately NOT set. The
          # E2.11-era comment this replaces recorded that these four were
          # unconditionally REQUIRED in lib/config.ts's serverSchema, so
          # every supabase/__tests__ file's createServiceRoleClient() call
          # triggered a full server() parse that failed without them. That
          # was MAJOR-3 (Session 27-D): unconditional requirement coupled
          # this workflow — which never exercises signal ingestion — to an
          # opt-in feature. The fields are now optional under
          # NODE_ENV=test, required together only in production. A green
          # run here with no GITHUB_APP_* entries is the proof.
        # --no-file-parallelism: these tests all share one local Postgres/GoTrue
        # instance (single ephemeral CI container), so running test files
        # concurrently buys no isolation — only connection pressure. Vitest's
        # default file-level parallelism was fine while most files failed early
        # on the 42501 grants bug (low cumulative connection count); once fixed,
        # files ran to completion in parallel and exhausted local Postgres/GoTrue
        # connections, surfacing as PGRST001 "no connection to the server" and
        # GoTrue's "Database error creating new user" — not a permissions issue.
        # --retry=2: even fully sequential (see --no-file-parallelism above),
        # the local Postgres/GoTrue/PostgREST stack on a 2-core CI runner
        # occasionally can't keep up with auth-heavy setup (admin.createUser,
        # bcrypt hashing) and momentarily refuses connections or can't reload
        # its schema cache — PGRST001 "no connection to the server" and
        # GoTrue's "Database error creating new user" are the services' own
        # internal retry messages surfacing to the client as a failure. These
        # are self-describing transient errors, not deterministic bugs (the
        # exact test that trips varies run to run) — unlike the earlier 42501
        # grants bug, retrying here is the correct fix, not a band-aid.
        # ADR 0015 §4: JSON reporter output is the skip-guard's only input — it is written
        # regardless of pass/fail (vitest emits --outputFile before exiting), and vitest's own
        # exit code is allowed to propagate (no `|| true`) so a genuinely failing run already
        # fails the job even before the guard runs.
        run: npm run test:db -- --reporter=json --outputFile=/tmp/db-results.json

      # ADR 0015 §4 (CI-NO-SKIPPED-SUITE + CI-NO-SWALLOWED-FAILURE): fails the job if any
      # supabase/__tests__ file ran zero/all-skipped tests (invisible — the false-green shape),
      # OR if any test genuinely failed. `if: always()` only guarantees this reporting/guard step
      # still runs after the previous step already failed, so we always learn WHY (empty vs red);
      # it is never paired with a swallowed exit code.
      - name: Skip-guard — fail if any suite is INVISIBLE or RED
        if: always()
        run: node scripts/ci/assert-no-empty-suite.mjs /tmp/db-results.json

      - name: Dump Supabase status + container logs on failure
        if: failure()
        run: |
          {
            supabase status || true
            docker ps -a || true
            echo "--- host memory (free -h) ---"
            free -h || true
            echo "--- kernel OOM-killer messages (dmesg) ---"
            dmesg 2>/dev/null | grep -i -E "out of memory|oom.kill|killed process" || echo "(no dmesg access or no OOM lines)"
            # Session 30.5-D, D8 (BLOCKER-2): docker inspect's OOMKilled flag only
            # reflects the tracked PID 1 (Postgres's postmaster). A cgroup kill of
            # a CHILD backend never sets it, but Postgres's own crash-recovery
            # design still terminates every backend and restarts into recovery —
            # the 57P03 signature this pass diagnosed. memory.events' oom_kill
            # counter catches that case; docker inspect alone cannot.
            echo "--- cgroup memory counters (host-level) ---"
            for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events; do
              [ -r "$f" ] && { echo "-- $f --"; cat "$f"; } || echo "-- $f not readable --"
            done
            for c in $(docker ps -a --filter "name=supabase" --format '{{.Names}}'); do
              echo "--- inspect state: $c ---"
              docker inspect "$c" --format '{{.Name}}: ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Restarting={{.State.Restarting}} StartedAt={{.State.StartedAt}} FinishedAt={{.State.FinishedAt}}' || true
              echo "--- logs: $c ---"
              docker logs "$c" --tail 200 || true
            done
          } | tee /tmp/db-tests-diagnostics.log

      # ADR 0015 §3.3 (CI-OOM-DIAGNOSTIC): persist the failure dump so a crash is diagnosable
      # after the runner is gone, instead of scrolled off the live log. "Intermittently red" is
      # not acceptable without evidence naming which container OOMed and the host memory at the
      # time.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-tests-oom-evidence
          path: /tmp/db-tests-diagnostics.log
          retention-days: 7

      # Session 30.5-D, D8 (BLOCKER-2): uploaded UNCONDITIONALLY, not `if: failure()`
      # — a process killed mid-run by the cgroup memory controller may never trip
      # the failure trap above, so the only record of it is this live-sampled log.
      - name: Stop memory-pressure watch and upload its log
        if: always()
        run: |
          [ -n "${MEM_WATCH_PID:-}" ] && kill "$MEM_WATCH_PID" 2>/dev/null || true
      - name: Upload memory-pressure watch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-tests-mem-watch
          path: /tmp/mem-watch.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup
