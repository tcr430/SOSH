name: App tests (tsc + eslint + vitest)

# Tier-2 (ADR 0015 §2). Runs on EVERY push and PR. MUST NOT start the Supabase stack and MUST NOT depend on
# db-tests — the whole point (L-3 / D-2) is that DB flakiness never masks the app-layer signal.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'          # matches db-tests.yml (Node 24 / npm 11) + package-lock resolution
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm install -g npm@11
          npm ci
      - name: Typecheck
        run: npm run typecheck        # tsc --noEmit --skipLibCheck
      - name: Lint
        run: npm run lint             # eslint (existing package.json script)
      # Session 22-D (MAJOR-1): JSON-reportered, guarded the same way db-tests.yml is (ADR 0015 §4)
      # — no `|| true`, vitest's own exit code propagates, and the skip-guard step below is the
      # single authority that can still fail the job on an invisible (empty/all-skipped) suite.
      - name: App-layer test suite (JSON-reportered)
        # E2.11 fix — two files import the REAL lib/config.ts unmocked
        # (lib/config.test.ts tests serverSchema directly; lib/signals/
        # orchestrator.test.ts transitively imports lib/signals/github-client.ts).
        # Every other file mocks '@/lib/config', so this job never needed real
        # values before — but lib/config.ts's top-level publicSchema.parse() and
        # any config.server.* getter both throw on a genuinely missing required
        # field, regardless of whether this job talks to a live Supabase/GitHub
        # API (it doesn't — these are inert dummies, same values db-tests.yml
        # already uses for its own copy of this same requirement).
        env:
          NODE_ENV: test
          ANTHROPIC_API_KEY: 'sk-ant-test-dummy-key-not-real'
          STRIPE_SECRET_KEY: 'sk_test_dummy0000000000000000'
          STRIPE_WEBHOOK_SECRET: 'whsec_dummy0000000000000000'
          STRIPE_PRICE_ID_PLUS: 'price_dummy_plus'
          STRIPE_PRICE_ID_PRO: 'price_dummy_pro'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_dummy0000000000000000'
          OAUTH_STATE_SECRET: 'ci-dummy-oauth-state-secret-32chars-min'
          INVITE_TOKEN_SECRET: 'ci-dummy-invite-token-secret-32chars-min'
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-dummy-anon-key-not-real'
          SUPABASE_SERVICE_ROLE_KEY: 'ci-dummy-service-role-key-not-real'
          GITHUB_APP_ID: 'ci-dummy-app-id-123456'
          GITHUB_APP_CLIENT_ID: 'Iv1.ci-dummy-client-id'
          GITHUB_APP_CLIENT_SECRET: 'ci-dummy-client-secret-not-real'
          GITHUB_APP_PRIVATE_KEY: 'LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQpNSUlFb3dJQkFBS0NBUUVBdGVzdGR1bW15a2V5Y2lkb25vdHVzZWZvci1zaWduaW5nCi0tLS0tRU5EIFJTQSBQUklWQVRFIEtFWS0tLS0tCg=='
        run: npm run test:app -- --reporter=json --outputFile=/tmp/app-results.json
                                       # vitest run app/ lib/ components/ — never supabase/__tests__ (L-3)

      # ADR 0015 §4, extended to app-tests (session 22-D MAJOR-1): fails the job if any file under
      # app/, lib/, or components/ ran zero/all-skipped tests, or if any test genuinely failed. With
      # the four real-network __integration__ suites now absent from vitest.config.ts's default
      # include (see vitest.integration.config.ts), no allowlist is needed here — nothing inside
      # app-tests may be empty.
      - name: Skip-guard — fail if any app-tests suite is INVISIBLE or RED
        if: always()
        run: node scripts/ci/assert-no-empty-suite.mjs /tmp/app-results.json app lib components
